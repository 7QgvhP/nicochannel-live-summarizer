### NicoChannel Live Summarizer 設定ファイル
### 変更後はツールを再起動してください。

[channel]
# 監視対象チャンネルのURL。末尾のスラッシュは付けても付けなくても構いません。
url = "https://nicochannel.jp/kumonoue_yumemi"

# チャンネル内部ID。空にしておくと URL から自動解決します（通常は空のままで可）。
site_id = ""


[detector]
# 通常時のポーリング間隔（秒）。配信予定がない、または予定時刻から離れているとき。
poll_interval_idle_sec = 300

# 配信予定時刻の前後（near_window_min）にいるときのポーリング間隔（秒）。
poll_interval_near_sec = 30

# 「予定時刻が近い」と判定する幅（分）。予定の何分前から密に監視するか。
near_window_min = 30

# 録画中に「配信が終了したか」を確認する間隔（秒）。
poll_interval_live_sec = 30

# 配信終了を確定するまでに必要な連続確認回数。
# 一時的なAPIの揺らぎで録音が切れるのを防ぎます。
finish_confirm_count = 3


[recorder]
# 録音するループバックデバイス名の一部。空なら「既定の再生デバイス」を自動使用。
# 利用可能なデバイスは `.\run.ps1 devices` で確認できます。
device_name = ""

# 1配信あたりの最大録音時間（時間）。暴走防止の安全弁。
max_hours = 8

# 保存する音声形式: "opus"（高圧縮・推奨） / "wav"（無圧縮・巨大）
audio_format = "opus"

# opus のビットレート（kbps）。雑談配信なら 48〜64 で十分な音質です。
opus_bitrate_kbps = 64


[video]
# 配信画面も録画するか。false なら音声のみ（従来どおり）。
#
# 注意: モニタ1枚を丸ごと録画します。配信を表示しているモニタに映っているもの
# （通知・タスクバー・他のウィンドウ）もそのまま記録されます。
# 配信は全画面表示にし、そのモニタでは他の作業をしない運用を想定しています。
enabled = true

# 録画対象のディスプレイ番号。`.\run.ps1 displays` で確認できます。
display_index = 0

# 出力する高さ（px）。幅は縦横比を保って自動決定されます。
# このPCのディスプレイは 1920x1080 なので、1080 が等倍（拡大縮小なし）です。
# 720 で約 0.5〜0.7 GB/時、1080 で約 1〜1.8 GB/時が目安です。
height = 1080

# フレームレート。雑談配信なら 30 で十分、15 まで下げると容量が約半分になります。
framerate = 30

# 画質。数値が小さいほど高画質・大容量（目安: 26=高画質 / 30=標準 / 34=省容量）。
quality_cq = 30

# 画面の一部だけを切り出す場合に "幅:高さ:X座標:Y座標" 形式で指定します。
# 例: 左上から 1280x720 を切り出す → "1280:720:0:0"
# 空文字ならモニタ全体を録画します。
crop = ""

# 使用するエンコーダ。"auto" は NVENC を試し、失敗したら libx264 に切り替えます。
encoder = "auto"


[browser]
# 配信ページを専用ブラウザで開き、再生が止まったら自動で復旧するか。
#
# 不在時の録画では、ブラウザ側で再生が止まっても誰も気づけません。
# true にすると、再生状態を直接確認して復旧を試みます。
#
# 使う前に `.\run.ps1 browser-login` で一度だけログインしてください。
# ログインはご自身で行い、本ツールは ID / パスワードを扱いません。
#
# false にすると、従来どおり自分でブラウザを開いて再生する運用になります。
enabled = true

# ログイン情報（Cookie等）を保存するフォルダ。
# このフォルダにはセッション情報が入るため、共有しないでください。
profile_dir = ".browser-profile"

# 使用するブラウザ。"chrome" は実機にインストール済みの Chrome を使います。
# Playwright 同梱の Chromium を使う場合は "chromium"。
channel = "chrome"

# 再生が始まったらプレイヤーを全画面にするか。
# 画面録画に余計なもの（サイト のヘッダー等）が写り込まなくなります。
fullscreen = true

# コメントを非表示にするか。
# 映像に重なる流れるコメントと、サイドのコメント欄の両方を隠します。
hide_comments = true


[power]
# 監視・録画の実行中に PC がスリープしないようにするか。
#
# S3 スリープに入るとプロセスごと停止するため、配信の検知も録音もできません。
# true にしておくと、ツールの実行中だけスリープを抑止します。
# 画面録画が有効な場合は、録画中はディスプレイの電源も切れないようにします
# （Desktop Duplication はディスプレイが消えると取得に失敗することがあるため）。
#
# 電源プランの設定そのものは変更しません。ツールを終了すれば通常どおりに戻ります。
prevent_sleep = true


[transcriber]
# faster-whisper のモデル。large-v3 が日本語で最も高精度。
# VRAMが足りない場合は "medium" や "large-v3-turbo" に下げてください。
model = "large-v3"

# "cuda"（GPU）/ "cpu"。cuda で失敗した場合は自動的に cpu にフォールバックします。
device = "cuda"

# "float16"（GPU推奨）/ "int8_float16" / "int8"（CPU推奨）
compute_type = "float16"

# 認識言語。自動判定させたい場合は "" にしてください。
language = "ja"

# ビームサーチ幅。大きいほど高精度だが低速。
beam_size = 5

# 無音区間を除去してから認識する（長時間配信で精度・速度ともに向上）。
vad_filter = true


[summarizer]
# false にすると要約をスキップし、文字起こしのみ保存します。
enabled = true

# 使用するモデル。
model = "claude-opus-5"

# 要約の最大出力トークン数。
# ここに達すると要約は途中で終わり、summary.md の冒頭に警告が入ります。
# 長時間で話題の多い配信が途中終了する場合は増やしてください。
max_tokens = 8000

# 思考の深さ: "low" / "medium" / "high" / "xhigh" / "max"
effort = "high"


[archive]
# アーカイブの保存先ルート（このファイルからの相対パス、または絶対パス）。
root = "archive"


[retention]
# 録音ファイルを保持する日数。この日数を過ぎた音声のみ自動削除します。
# 文字起こしと要約は削除されません。0 にすると削除しません（永久保持）。
audio_days = 30

# 録画ファイルを保持する日数。映像は音声の20倍以上の容量になるため、
# 音声より短めに設定することを推奨します。0 にすると削除しません。
video_days = 7
